<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Task</title>
    <style>
        .create-task-form {
            max-width: 500px;
            margin: 40px auto;
            padding: 20px;
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .create-task-form label {
            display: block;
            margin-bottom: 10px;
        }

        .create-task-form input[type="text"],
        .create-task-form input[type="number"],
        .create-task-form input[type="date"],
        .create-task-form select {
            width: 100%;
            height: 40px;
            margin-bottom: 20px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        .create-task-form input[type="submit"] {
            background-color: #4CAF50;
            color: #fff;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 80%;
        }

        .create-task-form input[type="submit"]:hover {
            background-color: #3e8e41;
        }

        @media (max-width: 768px) {
            .create-task-form {
                margin: 20px auto;
                padding: 10px;
            }
        }
    </style>
</head>
<body>
<div class="create-task-form">
    <h1>Create Task</h1>
    <form th:action="@{/tasks/create}" th:object="${task}" method="post">
        <label for="taskName">Task Name:</label>
        <input type="text" id="taskName" th:field="*{taskName}" placeholder="Please enter at least 10 characters taskname"/>
        <label for="taskDescription">Task Description:</label>
        <textarea id="taskDescription" th:field="*{taskDescription}" rows="10" cols="50" placeholder="Please write at least 1000 letters about the task assigining"></textarea>
        <span th:if="${#fields.hasErrors('taskDescription')}" th:errors="*{taskDescription}" style="color: red;"></span>

        <label for="projectId">Project ID:</label>
        <input type="number" id="projectId" th:field="*{projectId}" />
        <span th:if="${#fields.hasErrors('projectId')}" th:errors="*{projectId}" style="color: red;"></span>

        <label for="creatorId">Creator ID:</label>
        <input type="number" id="creatorId" th:field="*{creatorId}" />
        <span th:if="${#fields.hasErrors('creatorId')}" th:errors="*{creatorId}" style="color: red;"></span>
        <label for="assignedTo">Assigned To:</label>
        <input type="text" id="assignedTo" th:field="*{assignedTo}" />
        <span th:if="${#fields.hasErrors('assignedTo')}" th:errors="*{assignedTo}" style="color: red;"></span>
        <label for="assignedToId">Assigned To ID:</label>
        <input type="number" id="assignedToId" th:field="*{assignedToId}" />
        <span th:if="${#fields.hasErrors('assignedToId')}" th:errors="*{assignedToId}" style="color: red;"></span>
        <label for="status">Status:</label>
        <select id="status" th:field="*{status}">
            <option value="TODO">TODO</option>
            <option value="IN_PROGRESS">IN_PROGRESS</option>
            <option value="DONE">DONE</option>
        </select>
        <label for="priority">Priority:</label>
        <select id="priority" th:field="*{priority}">
            <option value="LOW">LOW</option>
            <option value="MEDIUM">MEDIUM</option>
            <option value="HIGH">HIGH</option>
        </select>
        <label for="category">Category:</label>
        <select id="category" th:field="*{category}">
            <option value="FRONTEND">FRONTEND</option>
            <option value="BACKEND">BACKEND</option>
            <option value="FULLSTACK">FULLSTACK</option>
        </select>
        <label for="dueDate">Due Date:</label>
        <input type="date" id="dueDate" th:field="*{dueDate}" />
        <span th:if="${#fields.hasErrors('dueDate')}" th:errors="*{dueDate}" style="color: red;"></span>
        <label for="createdBy">Created By:</label>
        <input type="text" id="createdBy" th:field="*{createdBy}" />
        <span th:if="${#fields.hasErrors('createdBy')}" th:errors="*{createdBy}"style="color: red;"></span>
        <div style="display: flex; justify-content: space-between; margin-top: 20px;">
            <a th:href="@{/tasks}"
               style="background-color: blue; color: #fff; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; text-decoration: none;">
                Back
            </a>

        <input type="submit" value="Create Task" />
        </div>

        <p th:if="${errorMessage}" style="color: red;" th:text="${errorMessage}"></p>

    </form>


</div>
</body>
</html>
